[project]
name = "letourdataset"
version = "0.2.0"
description = "Tour de France historical data scraper and analyzer"
authors = [{ name = "Thomas Camminady", email = "0milieux_member@icloud.com" }]
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "aiohttp>=3.10",
    "rich>=13.0",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a5",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letourdataset"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
